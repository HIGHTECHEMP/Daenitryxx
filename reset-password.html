<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Reset Password — DAENITRYXX</title>
<link href="css/styles.css" rel="stylesheet"/>
<meta content="#031117" name="theme-color"/></head>
<body class="auth-page" data-ui="daenitryxx"><div aria-hidden="true" class="ui-ambient"><span class="ambient-orb ambient-orb-a"></span><span class="ambient-orb ambient-orb-b"></span><span class="ambient-grid"></span></div>
<main class="auth-layout auth-shell"><a class="brand auth-brand" href="index.html"><span>DX</span> DAENITRYXX</a>
<section class="auth-card auth-card-shell">
<div class="auth-art"><div aria-hidden="true" class="auth-art-grid"><span class="art-grid-card art-grid-card-a"></span><span class="art-grid-card art-grid-card-b"></span></div><span class="eyebrow">SECURITY</span>
<h1>Set a new<br/><em>password.</em></h1>
</div>
<div class="auth-form-shell"><form class="auth-form" id="reset-form"><span class="eyebrow">RESET PASSWORD</span>
<h2>Choose a new password</h2><label>New password<input minlength="8" name="password" required="" type="password"/></label><button class="btn btn-primary btn-full">Update password</button>
<div class="form-message"></div>
</form></div>
</section>
</main>
<script type="module">import { supabase } from "./js/supabase-client.js"; import { formMessage } from "./js/utils.js"; const f = document.querySelector("#reset-form"); f.onsubmit = async e => { e.preventDefault(); const { error } = await supabase.auth.updateUser({ password: f.password.value }); formMessage(f, error?.message || "Password updated. You can now sign in.", error ? "error" : "success"); if (!error) setTimeout(() => location.href = "login.html", 1200) }</script>
</body>
</html>
