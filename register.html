<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Create Account — DAENITRYXX</title>
<link href="css/styles.css" rel="stylesheet"/>
<meta content="#031117" name="theme-color"/></head>
<body class="auth-page" data-ui="daenitryxx"><div aria-hidden="true" class="ui-ambient"><span class="ambient-orb ambient-orb-a"></span><span class="ambient-orb ambient-orb-b"></span><span class="ambient-grid"></span></div>
<main class="auth-layout auth-shell"><a class="brand auth-brand" href="index.html"><span>DX</span> DAENITRYXX</a>
<section class="auth-card auth-card-shell">
<div class="auth-art"><div aria-hidden="true" class="auth-art-grid"><span class="art-grid-card art-grid-card-a"></span><span class="art-grid-card art-grid-card-b"></span></div>
<div class="orb"></div><span class="eyebrow">CREATE YOUR ACCOUNT</span>
<h1>Ready when<br/><em>you are.</em></h1>
<p>Start with a secure customer account. Driver and agent applications are reviewed separately.</p>
</div>
<div class="auth-form-shell"><form class="auth-form" id="register-form"><span class="eyebrow">CUSTOMER REGISTRATION</span>
<h2>Create account</h2><label>Full name<input autocomplete="name" maxlength="120" name="full_name" required=""/></label><label>Email address<input autocomplete="email" name="email" required="" type="email"/></label><label>Phone number<input autocomplete="tel" maxlength="30" name="phone"/></label><label>Password<input autocomplete="new-password" minlength="8" name="password" required="" type="password"/></label><label>Confirm password<input autocomplete="new-password" minlength="8" name="confirm_password" required="" type="password"/></label><button class="btn btn-primary btn-full" type="submit">Create
                    account</button>
<div aria-live="polite" class="form-message"></div>
<p class="switch">Already registered? <a href="login.html">Sign in</a></p>
<p class="switch">Want to drive for us? <a href="driver-register.html">Apply as driver/agent</a></p>
</form></div>
</section>
</main>
<script src="js/main.js" type="module"></script>
</body>
</html>
