</nav>

<section class="dash-main ui-dashboard-main">
<header class="dash-top ui-dashboard-topbar">

          ☰
        </button>
<span class="eyebrow">
          CUSTOMER PORTAL
        </span>
<div class="dash-top-right">
<div class="notification-wrap" id="notification-wrap">

<div class="notification-panel" hidden="" id="notification-panel" aria-hidden="true">
<div class="notification-panel-head">
<div>
<span class="eyebrow">
                    UPDATES
                  </span>
<h2>
                    Notifications
                  </h2>
</div>
<button class="link-button" id="mark-all-read" type="button">
                  Mark all read
                </button>
</div>
<div class="notification-list" id="notifications-list"></div>
</div>
</div>
<b id="user-name">

          </b>
</div>

<main class="dash-content ui-dashboard-content"><div aria-hidden="true" class="content-glow"></div>

            </span>
<h1>
              Your profile.
            </h1>
<p class="muted">
              Keep your customer information up to date.
            </p>
</div>

<div class="panel-head">
<div>
<h2>
                Personal information
              </h2>
<p class="muted">
                Update the information associated with your account.
              </p>
</div>
</div>
<form class="dash-form" id="profile-form">
<label>

              Full name

              <input autocomplete="name" maxlength="120" name="full_name" required="" type="text"/>
</label>
<label>

              Phone

              <input autocomplete="tel" maxlength="30" name="phone" type="tel"/>
</label>
<div class="full">
<button class="btn btn-primary" type="submit">
                Save profile
              </button>
<div aria-live="polite" class="form-message"></div>
</div>
</form>
</section>
</main>
</section>
